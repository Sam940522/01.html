<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<!-- 網頁標題 -->
<title>ESP32 Firebase 監控</title>

<!-- 載入 Chart.js 圖表套件 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* 頁面設定 */
body {
    /* 外邊距設為 0 */
    margin: 0;

    /* 字體 */
    font-family: "Segoe UI", Arial;

    /* 視窗大小 */
    height: 100vh;

    /* 左右排列 */
    display: flex;

    /* 背景顏色 */
    background: radial-gradient(circle at top, #1c2b3a, #0b1220);

    /* 文字顏色 */
    color: white;
}

/* 左右區塊 */
.left, .right { 

    /* 寬度50% */ 
    width: 50%; 

    display: flex; 

    /* 垂直排列 */ 
    flex-direction: column; 

    /* 排版平均 */ 
    justify-content: 
    space-evenly; 

    /* 水平置中 */ 
    align-items: 

    center; 
}

/* 感測器介面 */
.left .box {
    /* 寬度65% */
    width: 65%;

    /* 上下左右留白20px */
    padding: 20px;

    /* 介面邊框圓角 */
    border-radius: 16px;

    text-align: center;

    color: white;

    /* 介面可點擊 */
    cursor: pointer;

    /* 變化效果 */  
    transition: 0.3s;

    /* 介面背景 */
    backdrop-filter: blur(8px);
}

/* 濕度介面顏色 */
.hum {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
}
/* 溫度介面顏色 */
.temp {
    background: linear-gradient(135deg, #ff512f, #dd2476);
}

/* 數值字樣 */
.value {
    /* 字體大小 */
    font-size: 54px;
    /* 字體加粗 */
    font-weight: bold;
    /* 內容間距 */
    margin-top: 10px;
}

/* 模組控制介面 */
.controlBox {
    /* 寬度65% */
    width: 65%;
    /* 上下左右留白20px */
    padding: 20px;
    /* 介面邊框圓角 */
    border-radius: 16px;

    /* 半透明背景 */
    background: rgba(255,255,255,0.05);
    /* 介面邊框圓角 */
    border: 1px solid rgba(255,255,255,0.1);
    /* 介面背景 */
    backdrop-filter: blur(10px);
    /* 文字置中 */
    text-align: center;
}

/* 模組開關介面配置 */
.switchGroup {
    /* 間距15px */
    margin-top: 15px;

    display: flex;
    /* 開關左右排列 */
    justify-content: space-around;
}

/* 模組開關樣式 */
.switch {

  position: relative;

  display: inline-block;
   /* 開關寬度60px */
  width: 60px;
   /* 開關寬度34px */
  height: 34px;
}

/* 開關 */
.slider {

  position: absolute;
  /* 開關可點擊 */
  cursor: pointer;

  inset: 0;
  /* 開關背景深灰色 */
  background: #333;
  /* 開關邊框圓角 */
  border-radius: 34px;
  /* 開關切換變化效果 */
  transition: 0.3s;
}

/* 開關圓球 */
.slider:before {

  content: " ";

  position: absolute;
  /* 圓球高度 */
  height: 26px;

  /* 圓球寬度 */
  width: 26px;

  /* 左側間距 4px */
  left: 4px;

  /* 底部間距 4px */
  bottom: 4px;

  /* 圓球顏色白色 */
  background: white;
  /* 開關圓形 */

  border-radius: 50%;

  /* 開關切換變化效果 */
  transition: 0.3s;
}

/* 開關圓球背景 */
input:checked + .slider {
    /* 背景綠色 */
    background: #4CAF50;
}

/* 切換時圓球移動 */
input:checked + .slider:before {
  transform: translateX(26px);
}

/* 右側圖表 */
.right {

    /* 半透明背景 */
    background: rgba(255,255,255,0.03);

    /* 左側分隔線 */
    border-left: 1px solid rgba(255,255,255,0.1);
}

/* 圖表標題 */
.right h2 {
    /* 標題下方間距10px */
    margin-bottom: 10px;

    /* 文字間距1px */
    letter-spacing: 1px;

    /* 文字藍色 */
    color: #00e5ff;
}
/* 底部文字 */
.status {
    /* 固定畫面底部 */
    position: fixed;

    /* 距離底部 12px */
    bottom: 12px;

    /* 置中 */
    left: 50%;
    transform: translateX(-50%);

    /* 字體大小 16px */
    font-size: 16px;

    /* 字體灰色 */
    color: #aaa;
}
</style>
</head>

<body>

<!-- 左側介面 -->
<div class="left">

    <!-- 濕度介面 -->
    <div class="box hum" onclick="showChart('hum')">
        <!-- 標題 -->
        <h2>濕度</h2>

        <!-- 即時濕度 -->
        <div class="value" id="hum">--</div>
    </div>

    <!-- 溫度介面 -->
    <div class="box temp" onclick="showChart('temp')">
        <!-- 標題 -->
        <h2>溫度</h2>

        <!-- 即時溫度 -->
        <div class="value" id="temp">--</div>
    </div>

    <!-- 開關控制介面 -->
    <div class="controlBox">
        <!-- 標題 -->
        <h3>模組開關控制</h3>

        <div class="switchGroup">
        
            <div>
                <!-- 開關外框 -->
                <label class="switch">
                  <!-- 開關 -->
                  <input type="checkbox"
                         id="fan1"
                         onchange="toggleFan('fan1')">
                  <!-- 開關滑桿 -->
                  <span class="slider"></span>

                </label>
                <!-- 開關名稱 -->
                <div>進氣模組</div>

            </div>

            <div>
                <!-- 開關外框 -->
                <label class="switch">
                  <!-- 開關 -->
                  <input type="checkbox"
                         id="fan2"
                         onchange="toggleFan('fan2')">
                  <!-- 開關滑桿 -->
                  <span class="slider"></span>

                </label>
                <!-- 開關名稱 -->
                <div>冷凝模組</div>
            </div>
        </div>
    </div>
</div>

<!-- 右側圖表 -->
<div class="right">

    <!-- 圖表標題 -->
    <h2 id="chartTitle">溫度變化圖</h2>

    <!-- Chart.js 圖表 -->
    <canvas id="chart"></canvas>

</div>

<!--底部文字 -->
<div class="status" id="status">連線中</div>

<script>

/* Firebase 資料庫網址 */
const baseURL = "https://removewesh-default-rtdb.firebaseio.com";

/* 濕度變化圖表 */
let currentType = "temp";

/* 儲存即時資料 */
const dataStore = {
    temp: {
        labels: [],
        data: []
    },
    hum: {
        labels: [],
        data: []
    }
};

/* 取得 canvas */
const ctx = document.getElementById("chart").getContext("2d");

/* 建立圖表 */
const chart = new Chart(ctx, {
    type: "line",
    data: {
        labels: [],
        datasets: [{
            data: [],

            /* 線條顏色 */
            borderColor: "#00e5ff",

            /* 線條粗細 */
            borderWidth: 3,

            /* 折線 */
            tension: 0
        }]
    },

    options: {
        responsive: true,
        /* 取消圖表動畫 */
        animation: false,
        
        plugins: {
            /* 不顯示溫度提示 */
            legend: {
                display: false 
            }
        },
        scales: {
            x: {
                ticks: {
                    /* x軸文字顏色 */
                    color: "#aaa"
                }
            },
            y: {
                ticks: {
                    /* y軸文字顏色 */
                    color: "#aaa"
                }
            }
        }
    }
});

/* 圖表切換 */
function showChart(type) {
    /* 顯示目前圖表 */
    currentType = type;

    /* 標題對應 */
    const titleMap = {
        temp: "溫度變化圖", 
        hum: "濕度變化圖"
    };

    /* 顏色對應 */
    const colorMap = {
        temp: "#ff4d4d", 
        hum: "#00c6ff"
    };

    /* 更新標題 */
    document.getElementById("chartTitle").innerText = titleMap[type];

    /* 更新線條顏色 */
    chart.data.datasets[0].borderColor = colorMap[type];

    /* 更新圖表資料 */
    chart.data.labels = dataStore[type].labels;

    /* 更新圖表數值資料 */
    chart.data.datasets[0].data = dataStore[type].data;

    /* 更新圖表 */
    chart.update();
}

/* 更新Firebase資料 */
async function update() {
    try {
        /* 讀取Firebase資料 */
        const res = await fetch(baseURL + "/.json");

        /* 轉json檔 */
        const data = await res.json();

        /* 如果沒有即時數值資料就停止 */
        if (!data || !data.sensor) return;

        /* 感測器資料 */
        const s = data.sensor;

        /* 更新溫度數值 */
        document.getElementById("temp").innerText = s.temperature + "°C";

        /* 更新濕度數值 */
        document.getElementById("hum").innerText = s.humidity + "%";

        /* 取得目前時間 */
        const time =
        new Date().toLocaleTimeString();

        /* 加入溫度資料 */
        dataStore.temp.labels.push(time);
        dataStore.temp.data.push(s.temperature);

        /* 加入濕度資料 */
        dataStore.hum.labels.push(time);
        dataStore.hum.data.push(s.humidity);

        /* 保留10筆資料 */
        ["temp","hum"].forEach(t=>
        {
            if(dataStore[t].labels.length > 10)
            {
                /* 超過10筆移除舊資料 */
                dataStore[t].labels.shift();

                /* 超過10筆移除舊數值 */
                dataStore[t].data.shift();
            }
        });
        /* 更新目前圖表 */
        chart.data.labels = dataStore[currentType].labels;

        /* 更新目前圖表資料 */
        chart.data.datasets[0].data = dataStore[currentType].data;

        chart.update();

        /* 更新開關狀態 */
        if (data.control) {
            /* 進氣模組狀態 */
            document.getElementById("fan1").checked = data.control.fan1 === "1";
            /* 冷凝模組狀態 */
            document.getElementById("fan2").checked = data.control.fan2 === "1";
        }
        /* 連線成功底部顯示已連線 */
        document.getElementById("status").innerText = "已連線";
    } 
    catch (e) {
        /* 連線失敗底部顯示連線失敗 */
        document.getElementById("status").innerText = "連線失敗";
    }
}
/* 模組開關控制 */
async function toggleFan(name) {
    /* 取得checkbox元件 */ 
    const el = document.getElementById(name);
    /* 開關判斷1或0 */
    const state = el.checked ? "1" : "0";
    /* 寫入Firebase */
    await fetch(baseURL + "/control/" + name + ".json",
        {
            /* PUT更新資料 */
            method: "PUT",
            /* 狀態轉成JSON檔格式 */
            body: JSON.stringify(state)
        }
    );
}
/* 第一次更新 */
update();

/* 每2秒更新一次 */
setInterval(update, 2000);

</script>

</body>
</html>
