<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>ESP32 Firebase 監控</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial;
    height: 100vh;
    display: flex;
    background: radial-gradient(circle at top, #1c2b3a, #0b1220);
    color: white;
}

/* 左右分區 */
.left, .right {
    width: 50%;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
}

/* ===== 卡片 ===== */
.left .box {
    width: 65%;
    padding: 20px;
    border-radius: 16px;
    text-align: center;
    color: white;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
}

.hum {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
}

.temp {
    background: linear-gradient(135deg, #ff512f, #dd2476);
}

.ash {
    background: linear-gradient(135deg, #00b09b, #96c93d);
}

.value {
    font-size: 54px;
    font-weight: bold;
    margin-top: 10px;
}

/* ===== 控制面板 ===== */
.controlBox {
    width: 65%;
    padding: 20px;
    border-radius: 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    text-align: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

.switchGroup {
    margin-top: 15px;
    display: flex;
    justify-content: space-around;
}

/* ===== switch ===== */
.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

.switch input { display:none; }

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: #333;
  border-radius: 34px;
  transition: 0.3s;
}

.slider:before {
  content: "";
  position: absolute;
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background: white;
  border-radius: 50%;
  transition: 0.3s;
}

input:checked + .slider {
    background: #2196F3;
}

input:checked + .slider:before {
  transform: translateX(26px);
}

/* ===== 右側圖表 ===== */
.right {
    background: rgba(255,255,255,0.03);
    border-left: 1px solid rgba(255,255,255,0.1);
}

.right h2 {
    margin-bottom: 10px;
    letter-spacing: 1px;
    color: #00e5ff;
}

/* status */
.status {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="left">

    <div class="box hum" onclick="showChart('hum')">
        <h2>濕度</h2>
        <div class="value" id="hum">--</div>
    </div>

    <div class="box temp" onclick="showChart('temp')">
        <h2>溫度</h2>
        <div class="value" id="temp">--</div>
    </div>

    <div class="box ash" onclick="showChart('ash')">
        <h2>灰塵濃度</h2>
        <div class="value" id="ash">--</div>
    </div>

    <div class="controlBox">
        <h3>模組開關控制</h3>

        <div class="switchGroup">
            <div>
                <label class="switch">
                  <input type="checkbox" id="fan1" onchange="toggleFan('fan1')">
                  <span class="slider"></span>
                </label>
                <div>進氣模組</div>
            </div>

            <div>
                <label class="switch">
                  <input type="checkbox" id="fan2" onchange="toggleFan('fan2')">
                  <span class="slider"></span>
                </label>
                <div>冷凝模組</div>
            </div>
        </div>
    </div>

</div>

<div class="right">
    <h2 id="chartTitle">溫度變化圖</h2>
    <canvas id="chart"></canvas>
</div>

<div class="status" id="status">初始化</div>

<script>

const baseURL = "https://removewesh-default-rtdb.firebaseio.com";

let currentType = "temp";

const dataStore = {
    temp: { labels: [], data: [] },
    hum:  { labels: [], data: [] },
    ash:  { labels: [], data: [] }
};

const ctx = document.getElementById("chart").getContext("2d");

const chart = new Chart(ctx, {
    type: "line",
    data: {
        labels: [],
        datasets: [{
            data: [],
            borderColor: "#00e5ff",
            borderWidth: 2,
            fill: false,
            tension: 0
        }]
    },
    options: {
        responsive: true,
        animation: false,
        plugins: { legend: { display: false } },
        scales: {
            x: { ticks: { color: "#aaa" } },
            y: { ticks: { color: "#aaa" } }
        }
    }
});

function showChart(type) {
    currentType = type;

    const titleMap = {
        temp: "溫度變化圖",
        hum: "濕度變化圖",
        ash: "灰塵密度變化圖"
    };

    const colorMap = {
        temp: "#ff4d4d",
        hum: "#00c6ff",
        ash: "#00ff88"
    };

    document.getElementById("chartTitle").innerText = titleMap[type];
    chart.data.datasets[0].borderColor = colorMap[type];

    chart.data.labels = dataStore[type].labels;
    chart.data.datasets[0].data = dataStore[type].data;

    chart.update();
}

async function update() {
    try {
        const res = await fetch(baseURL + "/.json");
        const data = await res.json();

        if (!data || !data.sensor) return;

        const s = data.sensor;

        document.getElementById("temp").innerText = s.temperature + "°C";
        document.getElementById("hum").innerText = s.humidity + "%";
        document.getElementById("ash").innerText = s.ash ?? "--";

        const time = new Date().toLocaleTimeString();

        dataStore.temp.labels.push(time);
        dataStore.temp.data.push(s.temperature);

        dataStore.hum.labels.push(time);
        dataStore.hum.data.push(s.humidity);

        dataStore.ash.labels.push(time);
        dataStore.ash.data.push(s.ash ?? 0);

        ["temp","hum","ash"].forEach(t=>{
            if(dataStore[t].labels.length>10){
                dataStore[t].labels.shift();
                dataStore[t].data.shift();
            }
        });

        chart.data.labels = dataStore[currentType].labels;
        chart.data.datasets[0].data = dataStore[currentType].data;
        chart.update();

        if (data.control) {
            document.getElementById("fan1").checked = data.control.fan1 === "1";
            document.getElementById("fan2").checked = data.control.fan2 === "1";
        }

        document.getElementById("status").innerText = "已連線";

    } catch (e) {
        document.getElementById("status").innerText = "連線失敗";
    }
}

async function toggleFan(name) {
    const el = document.getElementById(name);
    const state = el.checked ? "1" : "0";

    await fetch(baseURL + "/control/" + name + ".json", {
        method: "PUT",
        body: JSON.stringify(state)
    });
}

update();
setInterval(update, 2000);

</script>

</body>
</html>
